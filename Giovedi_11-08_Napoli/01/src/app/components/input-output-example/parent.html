<div class="parent-box">
    <h3>Componente Padre (Parent)</h3>

    <!-- Approccio Classico Decorator-Based (commentato nell'immagine) -->
    <!-- 
    <p>Contatore Classico (Parent): {{ counter }}</p>
    <app-child-component 
        [childCounter]="counter" 
        (counterChange)="onCounterChanged($event)">
    </app-child-component> 
    -->

    <!-- Approccio Moderno Signal-Based -->
    <p>Contatore Signal (Parent): <strong>{{ counterSignal() }}</strong></p>
    
    <!-- Passaggio del valore del Signal tramite binding del parametro childCounterSignal -->
    <!-- Ascolto dell'evento emesso dal figlio tramite counterChangeSignal -->
    <app-child-component 
        [childCounterSignal]="counterSignal()" 
        (counterChangeSignal)="onCounterChangedSignal($event)">
    </app-child-component>
</div>
